title = "Douglas Santos"
baseURL = 'https://odouglsantos.github.io'
locale = 'en-us'
defaultContentLanguage = 'en'
theme = "hugo-theme-sigil"

# To enable Google Analytics 4 (gtag.js) provide G-MEASUREMENT_ID below.
# To disable  Google Analytics, simply leave the field empty or remove the next line
googleAnalytics = '' # G-MEASUREMENT_ID

# Enable emojis globally
enableEmoji = true

# JSON output feeds the theme's on-the-fly (Fuse.js) search page
[outputs]
  home = ["HTML", "RSS", "JSON"]

# set markup.highlight.noClasses=false to enable code highlight
[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[menu]
  [[menu.main]]
    # The page reference (pageRef) is useful for menu highlighting
    # When pageRef is set, setting `url` is optional; it will be used as a fallback if the page is not found.
    pageRef="/"
    name = 'Home'
    url = '/'
    weight = 10
  [[menu.main]]
    pageRef="posts"
    name = 'Posts'
    url = '/posts/'
    weight = 20
  [[menu.main]]
    identifier = "archives"
    name = 'Archives'
    url = '/archives/'
    weight = 30
  [[menu.main]]
    identifier = "tags"
    name = 'Tags'
    url = '/tags/'
    weight = 40
  # A busca vive na caixa do topo (Ctrl+K); a página /search/ continua existindo.

[params]
  mainSections = ["posts"]
  sitename = "Douglas Santos"
  author = "Douglas Santos"
  description = "Welcome to my personal tech blog"
  defaultTheme = "dark" # light / dark / auto

  # Sigil homepage hero
  sgKicker = "Software engineer, gamer and cryptography aspirant"
  sgSealImage = "avatar.webp" # file lives in static/

  # Post chrome (PaperMod-inherited params)
  ShowBreadCrumbs = true
  ShowReadingTime = true
  ShowWordCount = true
  ShowToc = true
  TocOpen = false
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowFullTextinRSS = true

  [params.homeInfoParams]
    content = "Douglas Santos (aka Batman) — software engineer, gamer and cryptography aspirant."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/odouglsantos"

  [[params.socialIcons]]
    name = "linkedin"
    url = "http://www.linkedin.com/in/odouglsantos/"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:douglas@batcode.io"
