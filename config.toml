title = "Douglas Santos"
baseURL = 'https://odouglsantos.github.io'
theme = "hugo-blog-awesome"

# Multilingual: Portuguese is the default and stays at the site root, so every
# URL published before this change keeps working. English is served under /en/.
defaultContentLanguage = 'pt-br'
defaultContentLanguageInSubdir = false

# To enable Google Analytics 4 (gtag.js) provide G-MEASUREMENT_ID below.
# To disable  Google Analytics, simply leave the field empty or remove the next line
googleAnalytics = '' # G-MEASUREMENT_ID

# Enable emojis globally
enableEmoji = true

# set markup.highlight.noClasses=false to enable code highlight
[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[languages]

  [languages.pt-br]
    languageName = 'Português'
    languageCode = 'pt-BR'
    weight = 1
    title = "Douglas Santos"

    [languages.pt-br.params]
      sitename = "Douglas Santos"
      description = "Bem-vindo ao meu blog pessoal de tecnologia"

    [languages.pt-br.params.author]
      avatar = "avatar.webp"
      intro = "Douglas Santos (aka Batman)"
      name = "Douglas Santos"
      description = "Engenheiro de software, gamer e aspirante a criptógrafo"

    [[languages.pt-br.menu.main]]
      pageRef = "/"
      name = 'Início'
      url = '/'
      weight = 10

    [[languages.pt-br.menu.main]]
      pageRef = "posts"
      name = 'Posts'
      url = '/posts/'
      weight = 20

  [languages.en]
    languageName = 'English'
    languageCode = 'en-US'
    weight = 2
    title = "Douglas Santos"

    [languages.en.params]
      sitename = "Douglas Santos"
      description = "Welcome to my personal tech blog"

    [languages.en.params.author]
      avatar = "avatar.webp"
      intro = "Douglas Santos (aka Batman)"
      name = "Douglas Santos"
      description = "Software engineer, gamer and cryptography aspirant"

    [[languages.en.menu.main]]
      pageRef = "/"
      name = 'Home'
      url = '/en/'
      weight = 10

    [[languages.en.menu.main]]
      pageRef = "posts"
      name = 'Posts'
      url = '/en/posts/'
      weight = 20

[params]
  defaultColor = "dark" # set default color mode: dark or light

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/odouglsantos"

[[params.socialIcons]]
  name = "linkedin"
  url = "http://www.linkedin.com/in/odouglsantos/"

[[params.socialIcons]]
  name = "email"
  url = "mailto:douglas@batcode.io"
